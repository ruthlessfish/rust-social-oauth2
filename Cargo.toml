[workspace]
members = [
    "x-oauth2",
    "tiktok-oauth2",
    "instagram-oauth2",
]
resolver = "2"

[workspace.dependencies]
base64 = "0.22"
mockito = "1"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
